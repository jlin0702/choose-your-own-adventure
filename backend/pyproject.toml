[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jacky Lin", email = "jacky.lin@gatech.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.3",
    "langchain-google-genai[standard]>=4.4.2",
    "langchain[standard]>=1.4.6",
    "psycopg2-binary[standard]>=2.9.13",
    "sqlalchemy[standard]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
